# ============================================================================
# Uy-Laurio Legal Portal — Supabase CLI configuration
# ----------------------------------------------------------------------------
# Enables `supabase start` for a local stack and `supabase functions deploy`
# for the Edge Functions in supabase/functions.
#
# Replace project_id with your Supabase project ref before running
# `supabase link --project-ref <ref>`.
# ============================================================================

project_id = "uy-laurio"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.migrations]
schema_paths = []

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
# Global cap; the documents bucket sets its own stricter limit in 0005.
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false
double_confirm_changes = true

[auth.external.google]
enabled = false
client_id = ""
secret = ""
redirect_uri = ""

# ─── Edge Functions ─────────────────────────────────────────────────────────
# verify_jwt = true  -> caller must present a valid user JWT (admin checked in code)
# verify_jwt = false -> may be invoked by a scheduled job with the service key

[functions.admin-create-client]
verify_jwt = true

[functions.send-notification]
verify_jwt = false
